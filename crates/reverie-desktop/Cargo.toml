[package]
name = "reverie-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ReverieAgent desktop shell"

[lib]
name = "reverie_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embeds the built frontend into the binary instead of loading `devUrl`.
# Without this Tauri treats every build as "dev" and requires a Vite server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reverie-core.workspace = true
reverie-store.workspace = true
reverie-llm.workspace = true
reverie-tools.workspace = true
reverie-runtime.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
